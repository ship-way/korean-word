    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/script.js"></script>
    <script>
    var max_width=$("body").width();
        if(max_width>800){}//pc
        if(max_width<=800){}//모바일        
        
        $("#intro a .el").addClass("on")
        $("#intro a").click(function(){
            if(max_width>800){
                $("html").animate({"scrollTop":1120},300);
            }
            if(max_width<=800){
                $("html").animate({"scrollTop":900},300);
            }
            
            return false;
        });
        
        $("header li:nth-child(1) a").click(function(){
            if(max_width>800){
                $("html").animate({"scrollTop":1200},500);
            }
            if(max_width<=800){
                $("html").animate({"scrollTop":1000},500);
            }
            
            return false;
        });
        $("header li:nth-child(2) a").click(function(){
            if(max_width>800){
                $("html").animate({"scrollTop":2500},500);
            }
            if(max_width<=800){
                $("html").animate({"scrollTop":2800},500);
            }
            
            return false;
        });
        $("header li:nth-child(3) a").click(function(){
            if(max_width>800){
                $("html").animate({"scrollTop":3100},500);
            }
            if(max_width<=800){
                $("html").animate({"scrollTop":3250},500);
            }
            
            return false;
        });
        
        var sn=$("#portfolio .slide .show li").length;
        if(max_width>800){
            $("#portfolio .slide .show").css({"width":380*(sn-1)+160*sn+550})
            $("#portfolio .slide .show ul").css({"width":380*(sn-1)+160*sn+550})
        }
        if(max_width<=800){
            $("#portfolio .slide .show").css({"width":100*sn+"vw"})
            $("#portfolio .slide .show ul").css({"width":100*sn+"vw"})
        }
        
        for( var i=1; i<=sn; i++ ){
            if(i==1){
               $("#portfolio .slide .pg").append("<li class='select'><a href='#'>"+i+"</a></li>")
            } else {
                $("#portfolio .slide .pg").append("<li><a href='#'>"+i+"</a></li>")
            }
        }
        
        var sl=0;
        $("#portfolio .slide .next").click(function(){
            sl++
            if(sl>=sn){
                sl=sn-1;
            }
            
            if(max_width>800){
                $("#portfolio .slide .show ul").animate({"left":-540*sl},500)
            }
            if(max_width<=800){
                $("#portfolio .slide .show ul").animate({"left":-95*sl+"vw"},500)
            }
            $("#portfolio .slide .show li").eq(sl).addClass("select").siblings().removeClass("select")
            $("#portfolio .slide .pg li").eq(sl).addClass("select").siblings().removeClass("select")
            
            return false;
        });
        $("#portfolio .slide .prev").click(function(){
            sl--
            if(sl<0){
                sl=0;
            }
            
            if(max_width>800){
                $("#portfolio .slide .show ul").animate({"left":-540*sl},500)
            }
            if(max_width<=800){
                $("#portfolio .slide .show ul").animate({"left":-95*sl+"vw"},500)
            }
            $("#portfolio .slide .show li").eq(sl).addClass("select").siblings().removeClass("select")
            $("#portfolio .slide .pg li").eq(sl).addClass("select").siblings().removeClass("select")
            
            return false;
        });
        $("#portfolio .slide .pg li").click(function(){
            sl=$(this).index();
            
            if(max_width>800){
                $("#portfolio .slide .show ul").animate({"left":-540*sl},500)
            }
            if(max_width<=800){
                $("#portfolio .slide .show ul").animate({"left":-95*sl+"vw"},500)
            }
            $(this).addClass("select").siblings().removeClass("select")
             $("#portfolio .slide .show li").eq(sl).addClass("select").siblings().removeClass("select")
            
            return false;
        });
        
        function word(){
            $("#contact .word ul").animate({"top":-72},500,function(){
                $(this).append($("#contact .word li:first-child"))
                $(this).css({"top":0},500)
            })    
        }
        setInterval(word,5000)
        
        
        $(window).scroll(function(){
            var wt=$(this).scrollTop();
            
            if(max_width>800){
                if(wt>=500){
                    $("#intro a .ment").css({"opacity":"0","display":"none"})
                } else if(wt>=450){
                    $("#intro a .ment").css({"opacity":"0.2","display":"block"})      
                } else if(wt>=400){
                    $("#intro a .ment").css({"opacity":"0.4"})      
                } else if(wt>=350){
                    $("#intro a .ment").css({"opacity":"0.6"})      
                } else if(wt>=300){
                    $("#intro a .ment").css({"opacity":"0.8"})      
                } else {
                    $("#intro a .ment").css({"opacity":"1"})
                };
            }
            if(max_width<=800){
                if(wt>=350){
                    $("#intro a .ment").css({"opacity":"0","display":"none"})
                } else if(wt>=320){
                    $("#intro a .ment").css({"opacity":"0.2","display":"block"})      
                } else if(wt>=280){
                    $("#intro a .ment").css({"opacity":"0.4"})      
                } else if(wt>=240){
                    $("#intro a .ment").css({"opacity":"0.6"})      
                } else if(wt>=200){
                    $("#intro a .ment").css({"opacity":"0.8"})      
                } else {
                    $("#intro a .ment").css({"opacity":"1"})
                };
            }
            
            if(max_width>800){
                if(wt>=1100){
                    $("#about .ability .fl div").addClass("on")
                } else{
                    $("#about .ability .fl div").removeClass("on")
                };
            }
            if(max_width<=800){
                if(wt>=710){
                    $("#about .ability .fl div").addClass("on")
                } else{
                    $("#about .ability .fl div").removeClass("on")
                };
            }
            
         console.log(wt)
        });
       
        
    </script>
